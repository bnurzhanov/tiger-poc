apiVersion: tiger.microsoft.com/v1alpha1
kind: PerceptionWorkload
metadata:
  name: aisle-cycle-count
spec:
  deployment:
    target: azure-local
    replicas: 1

  sources:
    - id: aisle-12-camera
      type: rtsp
      uriFrom: CAMERA_AISLE12_RTSP_URI
      subjectId: aisle-12

  perception:
    provider: foundry-local
    model: pallet-counter
    observationType: PalletCount
    sampleEveryFrames: 30    # cycle counts don't need every-frame sampling

  eventMapping:
    ontology: inventory-v1
    rule:
      when: "abs(observation.value - system.expectedCount) > 0"
      emit:
        eventType: InventoryDiscrepancy
        delta: "observation.value - system.expectedCount"

  destination:
    connector: inventory-system   # different connector than existing-twin
    endpointFrom: WMS_ENDPOINT
    credentialFrom: WMS_CREDENTIAL