[project]
name = "tiger-poc"
version = "0.1.0"
description = "Portable factory perception MVP"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onvif-zeep>=0.2.12",
    "opencv-python>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiger_poc"]
