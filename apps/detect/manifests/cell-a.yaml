apiVersion: tiger.microsoft.com/v1alpha1
kind: PerceptionWorkload
metadata:
  name: cell-a-household-trial
  plantName: Demo Plant
  plantId: demo-plant-01
spec:
  source:
    id: cell-a-camera-01
    type: rtsp
    uriFrom: CAMERA_A_RTSP_URL
    subjectId: cell-a-object-position-01
  perception:
    provider: ultralytics
    model: ../yolo26n.pt
    labels: [chair]
    observationType: ObjectPresent
    sampleEveryFrames: 3
    device: cpu
    threads: 2
    imageSize: 640
  region:
    coordinates: normalized-xyxy
    bounds: [0.15, 0.2, 0.85, 0.9]
    matching: box-center
  presence:
    confidence: 0.5
    occupiedSeconds: 2.0
    emptySeconds: 3.0
    staleSeconds: 2.0
  destination:
    connector: local-jsonl
    path: ../../../data/cell-a/events.jsonl
    statusPath: ../../../data/cell-a/status.json