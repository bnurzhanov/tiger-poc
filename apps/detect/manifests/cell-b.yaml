apiVersion: tiger.microsoft.com/v1alpha1
kind: PerceptionWorkload
metadata:
  name: cell-b-household-trial
  plantName: Demo Plant
  plantId: demo-plant-01
spec:
  source:
    id: cell-b-camera-01
    type: rtsp
    uriFrom: CAMERA_B_RTSP_URL
    subjectId: cell-b-object-position-01
  perception:
    provider: ultralytics
    model: ../yolo26n.pt
    labels: [chair]
    observationType: ObjectPresent
    sampleEveryFrames: 3
    device: cpu
    threads: 2
    imageSize: 640
  region:
    coordinates: normalized-xyxy
    bounds: [0.25, 0.15, 0.9, 0.85]
    matching: box-center
  presence:
    confidence: 0.5
    occupiedSeconds: 2.0
    emptySeconds: 3.0
    staleSeconds: 2.0
  destination:
    connector: local-jsonl
    path: ../../../data/cell-b/events.jsonl
    statusPath: ../../../data/cell-b/status.json