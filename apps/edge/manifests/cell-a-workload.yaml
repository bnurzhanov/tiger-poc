apiVersion: tiger.microsoft.com/v1alpha1
kind: PerceptionWorkload
metadata:
  name: cell-a-pallet-presence
spec:
  plantName: "Demo Plant 01"
  plantId: "demo-plant-01"
  cellId: "cell-a"

  sources:
    - id: cell-a-camera-01
      type: rtsp
      uriFrom: CAMERA_CELLA_RTSP_URI
      subjectId: cell-a-pallet-position-01

  region:
    x_min: 0.15
    y_min: 0.20
    x_max: 0.75
    y_max: 0.85

  perception:
    provider: local-yolo
    model: yolo26n-pallet
    targetClass: pallet
    confidenceThreshold: 0.50
    occupiedConfirmationFrames: 3
    emptyConfirmationFrames: 5

  eventMapping:
    ontology: manufacturing-twin-v1
    observationType: PalletPresent

  destination:
    connector: fabric-eventstream
    connectionStringFrom: FABRIC_EVENTSTREAM_CONNECTION_STRING
    fallbackPath: ./detections-cell-a.jsonl
